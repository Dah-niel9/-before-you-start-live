name: Live Research Regression

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verdict-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test live-research.test.mjs
