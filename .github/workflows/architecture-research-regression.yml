name: Architecture Research Regression
on:
  push:
    branches: ["architecture-research-v1"]
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --input-type=module --check < worker-live.js
      - run: node architecture-research-regression.test.mjs
