name: Architecture Research Regression
on:
  push:
    branches: ["architecture-research-v1"]
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check current ESM modules
        run: |
          node --check worker-live.js
          node --check understanding.js
          node --check derived-assessments.js
      - name: Validate evidence mapping and interpretation (offline)
        run: |
          node tests/evidence-mapping-fixtures.mjs
          node tests/understanding-integration.mjs
