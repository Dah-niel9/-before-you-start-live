name: Controlled Live Research Smoke Test

on:
  workflow_dispatch:
    inputs:
      opportunity:
        description: 'Opportunity to test'
        required: true
        default: 'YouTube automation'
        type: string
      confirmation:
        description: 'Type YES_15_ADVANCED_SEARCHES (estimated 30 Tavily credits)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  live-smoke:
    if: inputs.confirmation == 'YES_15_ADVANCED_SEARCHES'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out isolated architecture test branch (never main research code)
        uses: actions/checkout@v4
        with:
          ref: architecture-research-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check offline Worker integration before live spending
        run: node tests/worker-pipeline-smoke.mjs
      - name: One controlled live research check
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TEST_OPPORTUNITY: ${{ inputs.opportunity }}
          CONFIRM_LIVE_RESEARCH: ${{ inputs.confirmation }}
        run: node tests/live-research-smoke.mjs
      - name: Upload evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-live-research-report
          path: tests/artifacts/live-research-report.json
          if-no-files-found: ignore
          retention-days: 7
