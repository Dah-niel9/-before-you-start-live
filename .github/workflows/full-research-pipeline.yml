name: Full Research Pipeline
on:
  push:
    branches: ["architecture-research-v1"]
  workflow_dispatch:
jobs:
  full-pipeline-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full 15-core plus 7-derived Worker pipeline (mocked, zero credits)
        run: node tests/worker-pipeline-smoke.mjs
      - name: Groq rate-limit and retry checks (mocked)
        run: node tests/groq-rate-limit.mjs
