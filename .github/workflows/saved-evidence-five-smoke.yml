
name: Saved Evidence Five Field Smoke

on:
  push:
    branches: [offline-understanding-comparison]
    paths: [.github/workflows/saved-evidence-five-smoke.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download saved Tavily evidence
        uses: actions/download-artifact@v4
        with:
          name: unified-15-real-evidence-report
          run-id: 40426461024
          github-token: ${{ github.token }}
          path: saved-evidence
      - name: Run five-field Groq test
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node grouped-five-saved-evidence-smoke.mjs
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saved-evidence-five-smoke-results
          path: tests/artifacts/grouped-five-smoke.json
          if-no-files-found: warn
  
