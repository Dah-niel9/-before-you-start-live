name: Final Architecture Regression
on:
  push:
    branches: ["architecture-research-v1"]
  workflow_dispatch:
jobs:
  final-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate derived fields and complete Worker (offline)
        run: |
          node tests/derived-assessments.mjs
          node tests/worker-pipeline-smoke.mjs
